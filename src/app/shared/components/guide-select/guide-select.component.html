<div class="select-root" [class.is-open]="open">
  <span class="select-label" [id]="inputId + '-label'">{{ label }}</span>
  <button #trigger type="button" class="select-trigger" role="combobox" aria-haspopup="listbox"
    [id]="inputId" [disabled]="disabled || !options.length" [attr.aria-expanded]="open"
    [attr.aria-labelledby]="inputId + '-label ' + inputId + '-value'"
    [attr.aria-controls]="open ? inputId + '-options' : null"
    [attr.aria-activedescendant]="open ? inputId + '-option-' + activeIndex : null"
    (click)="toggle()" (keydown)="onKeydown($event)">
    <span *ngIf="selected?.marker" class="trigger-marker" aria-hidden="true">{{ selected?.marker }}</span><span class="trigger-copy" [id]="inputId + '-value'">{{ selected?.label || placeholder }}</span>
    <span class="trigger-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5" /></svg></span>
  </button>
  <div *ngIf="open" class="select-popup" [class.opens-up]="openAbove">
    <div class="popup-heading" aria-hidden="true"><span>{{ label }}</span><span>{{ options.length | number:'2.0-0' }}</span></div>
    <div class="select-options" [style.max-height.px]="panelHeight" [id]="inputId + '-options'" role="listbox" tabindex="-1" [attr.aria-labelledby]="inputId + '-label'" data-lenis-prevent>
      <div *ngFor="let option of options; let i = index; trackBy: trackOption" class="select-option" role="option"
        [id]="inputId + '-option-' + i" [attr.data-option-index]="i" [attr.aria-selected]="option.value === value"
        [class.is-active]="activeIndex === i" (pointermove)="activeIndex = i" (mousedown)="$event.preventDefault()" (click)="choose(i)">
        <span class="option-marker" aria-hidden="true">{{ option.marker || (option.value | number:'2.0-0') }}</span>
        <span class="option-copy"><span class="option-title">{{ option.label }}</span><span class="option-detail" *ngIf="option.detail">{{ option.detail }}</span></span>
        <svg *ngIf="option.value === value" class="option-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10" /></svg>
      </div>
    </div>
  </div>
</div>
