<div class="library-container">
  <div class="library-header">
    <div class="header-content">
      <span class="page-eyebrow">Your collection</span>
      <h1 class="page-title">Your library</h1>
      <p class="page-subtitle">A home for the stories you want to return to.</p>
    </div>
  </div>

  <div id="create-collection" class="create-list-section">
    <form (ngSubmit)="addList()" class="create-list-form">
      <div class="form-group">
        <label for="collection-name">Name your collection</label>
        <input id="collection-name" [(ngModel)]="newListTitle" name="newListTitle" type="text" placeholder="Sunday cinema, all-time favorites..." required maxlength="80" class="sleek-input" />
      </div>
      <button type="submit" class="btn-create" [disabled]="!newListTitle.trim()">
        <i class="fas fa-plus"></i>
        Create collection
      </button>
    </form>
  </div>

  <div class="collections-grid">
    <div #collectionCard *ngFor="let list of lists" class="collection-card" [routerLink]="['/list', list.id]" role="link" tabindex="0" [attr.aria-label]="'Open ' + list.title + ' collection'" (keydown.enter)="collectionCard.click()" (keydown.space)="$event.preventDefault(); collectionCard.click()">
      <div class="collection-preview">
        <div class="preview-stack">
          <ng-container *ngFor="let movieId of list.movies.slice(0, 3); let i = index">
            <img
              [src]="getMoviePoster(movieId)"
              [alt]="'Movie poster'"
              class="preview-poster"
              [style.z-index]="3 - i"
              [style.transform]="'translateX(' + (i * 20) + 'px) rotate(' + (i * 2 - 2) + 'deg)'"
            />
          </ng-container>
          <div *ngIf="list.movies.length > 3" class="more-count">
            <span>+{{ list.movies.length - 3 }}</span>
          </div>
          <div *ngIf="list.movies.length === 0" class="empty-preview">
            <i class="fas fa-film"></i>
            <span>empty collection</span>
          </div>
        </div>
        <div class="collection-overlay">
          <div class="view-btn">
            <i class="fas fa-arrow-right"></i>
          </div>
        </div>
      </div>

      <div class="collection-info">
        <h3 class="collection-title">{{ list.title }}</h3>
        <div class="collection-meta">
          <span class="item-count">
            <i class="fas fa-film"></i>
            {{ list.movies.length }} {{ list.movies.length === 1 ? 'item' : 'items' }}
          </span>
          <button type="button" class="btn-delete-mini" [attr.aria-label]="'Delete ' + list.title + ' collection'" (click)="deleteList(list.id); $event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>


  </div>
</div>
