<app-dark-veil></app-dark-veil>

<app-loading-screen *ngIf="isLoading"></app-loading-screen>

<div class="app-container" [class.auth-shell]="isAuthRoute" *ngIf="!isLoading">
  <header class="app-header" [class.scrolled]="isScrolled" *ngIf="!isAuthRoute">
    <a class="logo" routerLink="/search" aria-label="Cinetex home" (click)="closeMobileMenu()">
      <span class="logo-mark">C</span>
      <span class="logo-text">cinetex<small>film index</small></span>
    </a>
    <nav id="mobile-primary-navigation" class="nav-links" [class.mobile-open]="mobileMenuOpen" aria-label="Primary navigation">
      <div class="mobile-menu-heading" *ngIf="mobileMenuOpen">
        <span>Now screening</span>
        <strong>Choose your next watch</strong>
      </div>
      <div class="mobile-search-container" *ngIf="mobileMenuOpen">
        <div class="mobile-search-bar">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search movies, shows..." #mobileSearchInput (keyup.enter)="onSearch(mobileSearchInput.value); closeMobileMenu()">
          <button class="search-btn" (click)="onSearch(mobileSearchInput.value); closeMobileMenu()">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>
      <a routerLink="/search" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-home"></i>
        <span>home</span>
      </a>
      <a routerLink="/lists" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-layer-group"></i>
        <span>my library</span>
      </a>
      <a routerLink="/favorites" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-heart"></i>
        <span>favorites</span>
      </a>
      <a routerLink="/rated" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-star"></i>
        <span>rated</span>
      </a>
      <a *ngIf="authUser; else mobileSignInLink" routerLink="/profile" routerLinkActive="active" class="nav-link mobile-account-link" (click)="closeMobileMenu()">
        <span class="mobile-account-copy"><small>Signed in as</small>{{ profileName }}</span>
        <span class="mobile-account-avatar" aria-hidden="true">{{ profileInitial }}</span>
      </a>
      <ng-template #mobileSignInLink>
        <a routerLink="/auth" class="nav-link mobile-account-link" (click)="closeMobileMenu()">
          <span class="mobile-account-copy"><small>Personalize Cinetex</small>Sign in</span>
          <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </a>
      </ng-template>
    </nav>
    <div class="header-right">
      <a *ngIf="authUser; else signInLink" routerLink="/profile" class="account-link account-link-profile" (click)="closeMobileMenu()" [attr.aria-label]="'Open ' + profileName + '\'s profile'">
        <span class="account-avatar" aria-hidden="true">{{ profileInitial }}</span>
        <span>{{ profileName }}</span>
      </a>
      <ng-template #signInLink>
        <a routerLink="/auth" class="account-link" (click)="closeMobileMenu()"><i class="far fa-user"></i><span>sign in</span></a>
      </ng-template>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search..." #searchInput (keyup.enter)="onSearch(searchInput.value)">
        <button class="search-btn" (click)="onSearch(searchInput.value)">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <button type="button" class="mobile-menu-toggle" (click)="toggleMobileMenu()" [class.open]="mobileMenuOpen" aria-controls="mobile-primary-navigation" [attr.aria-expanded]="mobileMenuOpen" [attr.aria-label]="mobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="main-content" #mainContent>
    <router-outlet></router-outlet>
  </main>

  <app-footer *ngIf="!isAuthRoute"></app-footer>
  <app-chatbot *ngIf="!isAuthRoute"></app-chatbot>
</div>
